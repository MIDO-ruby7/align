name = "align"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./workers/app.ts"

upload_source_maps = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "align-db"
database_id = "00000000-0000-0000-0000-000000000000"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

# ---------------------------------------------------------------------------
# Preview environment (PR previews)
# ---------------------------------------------------------------------------
[env.preview]
name = "align-preview"

[env.preview.vars]
BETTER_AUTH_URL = "https://align-preview.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "align-preview"
database_id = "preview-db-id-placeholder"

[env.preview.durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDurableObject" }]

[[env.preview.migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

# ---------------------------------------------------------------------------
# Production environment (main branch deploys)
# ---------------------------------------------------------------------------
[env.production]
name = "align-production"

[env.production.vars]
BETTER_AUTH_URL = "https://align.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "align-production"
database_id = "production-db-id-placeholder"

[env.production.durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDurableObject" }]

[[env.production.migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]
